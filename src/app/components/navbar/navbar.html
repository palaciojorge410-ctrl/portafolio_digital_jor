<header class="navbar">
 <a class="navbar__logo" href="#">Jorge</a>

  <nav class="navbar__links" aria-label="Navegación principal">
    <a href="#sobre-mi">{{ i18n.t().nav.about }}</a>
    <a href="#proyectos">{{ i18n.t().nav.projects }}</a>
    <a href="#habilidades">{{ i18n.t().nav.skills }}</a>
    <a href="#experiencia">{{ i18n.t().nav.experience }}</a>
    <a href="#contacto">{{ i18n.t().nav.contact }}</a>

    <button
      class="navbar__theme"
      type="button"
      (click)="i18n.toggle()"
      aria-label="Cambiar idioma / Change language"
    >
      {{ i18n.lang() === 'es' ? 'EN' : 'ES' }}
    </button>

    <button
      class="navbar__theme"
      type="button"
      (click)="toggleTheme()"
      aria-label="Cambiar entre tema claro y oscuro"
    >
      {{ theme() === 'light' ? '🌙' : '☀️' }}
    </button>
  </nav>
</header>
